---

# "I1 SSH" "Enable/disable remote command line access using SSH" \
# Reference check-then-change Option. Other boolean Options copy this shape.
# The block carries only the base tag. Inner tasks add the :enable/:disable
# suffix tags, because Ansible adds block tags to every inner task.
- name: I1 SSH
  tags:
    - "raspi_config:interface:ssh"
  block:
    - name: Read SSH state (I1)
      ansible.builtin.command:
        argv:
          - raspi-config
          - nonint
          - get_ssh
      register: raspi_config__check_ssh
      changed_when: false
      check_mode: false
      failed_when: >-
        raspi_config__check_ssh.rc != 0 or
        (raspi_config__check_ssh.stdout | trim) not in ['0', '1']
      tags:
        - "raspi_config:interface:ssh:enable"
        - "raspi_config:interface:ssh:disable"

    - name: Enable SSH (I1)
      ansible.builtin.command:
        argv: >-
          {{ raspi_config__noop_argv if ansible_check_mode
          else ['raspi-config', 'nonint', 'do_ssh', '0'] }}
      register: raspi_config__change_ssh_enable
      changed_when: true
      check_mode: false
      when:
        - raspi_config_enable_ssh
        - (raspi_config__check_ssh.stdout | trim) != raspi_config__options.ssh.true_output
      tags:
        - "raspi_config:interface:ssh:enable"

    - name: Disable SSH (I1)
      ansible.builtin.command:
        argv: >-
          {{ raspi_config__noop_argv if ansible_check_mode
          else ['raspi-config', 'nonint', 'do_ssh', '1'] }}
      register: raspi_config__change_ssh_disable
      changed_when: true
      check_mode: false
      when:
        - not raspi_config_enable_ssh
        - (raspi_config__check_ssh.stdout | trim) == raspi_config__options.ssh.true_output
      tags:
        - "raspi_config:interface:ssh:disable"

    - name: Verify SSH state (I1)
      ansible.builtin.command:
        argv:
          - raspi-config
          - nonint
          - get_ssh
      register: raspi_config__verify_ssh
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - raspi_config__change_ssh_enable is changed or raspi_config__change_ssh_disable is changed
      failed_when: >-
        raspi_config__verify_ssh.rc != 0 or
        (raspi_config__verify_ssh.stdout | trim) not in ['0', '1'] or
        ((raspi_config__verify_ssh.stdout | trim) == raspi_config__options.ssh.true_output)
        != (raspi_config_enable_ssh | bool)
      tags:
        - "raspi_config:interface:ssh:enable"
        - "raspi_config:interface:ssh:disable"
  rescue:
    - name: Report SSH failure (I1)
      ansible.builtin.fail:
        msg: >-
          Option I1 SSH failed in '{{ ansible_failed_task.name }}':
          rc={{ ansible_failed_result.rc | default('n/a') }}
          stdout={{ ansible_failed_result.stdout | default('') }}
          stderr={{ ansible_failed_result.stderr | default('') }}
      tags:
        - "raspi_config:interface:ssh:enable"
        - "raspi_config:interface:ssh:disable"

